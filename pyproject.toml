[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-music-player"
dynamic = ["version"]
description = "Play music videos as animated ASCII art in the terminal, with audio and synchronized lyrics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["ascii", "terminal", "music", "video", "lyrics", "mpv", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "rich>=13.7",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]
package = ["pyinstaller>=6.0"]

[project.urls]
Repository = "https://github.com/yasithdharmasenagit/cli-music-player"

[project.scripts]
ascii-music-player = "src.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "src._version.__version__" }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false  # platform-specific code needs ignores on one OS only
ignore_missing_imports = true
files = ["src"]
