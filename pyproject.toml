[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-music-player"
version = "0.1.0"
description = "Play videos as animated ASCII art in the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]

[project.scripts]
ascii-music-player = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
